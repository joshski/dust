name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run quality checks
        run: ./bin/dust check

      - name: Build
        run: bun run build

      - name: Publish to npm
        run: npm publish --access public

  smoke-test:
    name: Smoke test published package
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Wait for npm propagation
        run: sleep 30

      - name: Install published package
        run: |
          mkdir smoke-test && cd smoke-test
          npm init -y
          npm install @joshski/dust@${{ github.ref_name }}

      - name: Verify help command
        run: |
          cd smoke-test
          OUTPUT=$(npx @joshski/dust help)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "dust"
          echo "$OUTPUT" | grep -q "Usage:"
